<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Broom Blasters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: a one-screen arcade cabinet. Framed night-sky playfield on top, a thumb-reach control deck below.
   Look: midnight indigo ground, house-yellow as the hero color, cool spell-blue for magic, ember orange for danger. */
:root{
  color-scheme: dark;
  --bg:#0e1028;
  --bg-2:#181c45;
  --ink:#fff6dc;
  --ink-dim:#b8b2d6;
  --gold:#ffc72c;
  --gold-deep:#a8730a;
  --amber:#ff9d1c;
  --spell:#7fdcff;
  --ember:#ff7a45;
  --violet:#a78bfa;
  --line:#2f3670;
  --font-display:'Uncial Antiqua', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-ui:'Silkscreen', 'Courier New', monospace;
  --font-body:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{
  height:100%;
  margin:0 auto;
  max-width:520px;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  display:grid;
  place-items:center;
  border:2px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:var(--bg);
}
#stage::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:6;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(5,6,20,.45) 100%);
}
#game{display:block;touch-action:none}

#overlay{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  padding:12px;
  overflow:auto;
  background:rgba(14,16,40,.92);
}
.panel{
  width:100%;
  max-width:340px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  text-align:center;
}
.logo{
  margin:0;
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(26px, 9.5vw, 38px);
  line-height:1.05;
  letter-spacing:.02em;
  overflow-wrap:anywhere;
  text-transform:uppercase;
}
.logo span{display:block}
.logo .a{color:var(--gold);text-shadow:0 3px 0 var(--gold-deep), 0 0 22px rgba(255,199,44,.35)}
.logo .b{color:var(--ink);text-shadow:0 3px 0 var(--line)}
.credit{
  align-self:center;
  margin:2px 0;
  padding:4px 12px;
  border:2px solid var(--ink);
  background:var(--gold);
  color:var(--bg);
  font-family:var(--font-display);
  font-size:14px;
  letter-spacing:.06em;
  text-transform:uppercase;
  transform:rotate(-3deg);
  box-shadow:3px 3px 0 var(--violet);
}
.sub{margin:0;font-family:var(--font-body);font-size:14px;color:var(--ink-dim)}
.dex{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left}
.dex li{
  display:grid;
  grid-template-columns:44px minmax(0,1fr);
  gap:10px;
  align-items:center;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(24,28,69,.7);
}
.dex canvas{width:44px;height:auto;display:block;justify-self:center;image-rendering:pixelated}
.dex b{display:block;font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--gold)}
.dex span{display:block;font-family:var(--font-body);font-size:12px;line-height:1.35;color:var(--ink)}
.hint{margin:0;font-family:var(--font-body);font-size:12px;line-height:1.45;color:var(--ink-dim)}
.best{margin:0;font-size:11px;letter-spacing:.14em;color:var(--spell)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats div{padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:rgba(24,28,69,.7)}
.stats small{display:block;font-size:9px;letter-spacing:.14em;color:var(--ink-dim)}
.stats strong{display:block;margin-top:4px;font-weight:400;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats .hot strong{color:var(--gold)}
.btn{
  align-self:center;
  min-width:200px;
  padding:13px 22px;
  border:3px solid var(--ink);
  border-radius:12px;
  background:var(--gold);
  color:var(--bg);
  font-family:var(--font-display);
  font-size:20px;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
  box-shadow:0 5px 0 var(--gold-deep);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-deep)}

#deck{display:flex;gap:12px;align-items:stretch;height:116px;flex:0 0 auto}
#left{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px}
#pad{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  border:2px solid var(--line);
  border-radius:999px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  touch-action:none;
  cursor:ew-resize;
  overflow:hidden;
}
#pad .cap{
  position:absolute;left:0;right:0;top:7px;
  text-align:center;font-size:9px;letter-spacing:.24em;color:var(--ink-dim);
  transition:opacity .3s;
}
#pad.used .cap{opacity:.3}
#pad .track{
  position:absolute;left:23px;right:23px;top:58%;height:8px;margin-top:-4px;border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 12px);
}
#puck{
  position:absolute;top:58%;left:50%;
  width:40px;height:40px;margin:-20px 0 0 -20px;
  border-radius:50%;
  background:var(--spell);
  border:3px solid var(--ink);
  box-shadow:0 0 16px rgba(127,220,255,.55);
}
#mini{display:flex;gap:8px;flex:0 0 auto}
.chip{
  flex:1 1 0;min-width:0;height:30px;
  border:2px solid var(--line);border-radius:8px;
  background:var(--bg-2);color:var(--ink-dim);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
#fire{
  flex:0 0 auto;align-self:center;
  width:104px;height:104px;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--gold);
  color:var(--bg);
  font-family:var(--font-display);
  font-size:22px;letter-spacing:.04em;text-transform:uppercase;
  box-shadow:0 6px 0 var(--gold-deep), 0 0 24px rgba(255,199,44,.35);
  touch-action:none;cursor:pointer;
}
#fire.down{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-deep), 0 0 24px rgba(255,199,44,.55)}
</style>

<main id="stage">
  <canvas id="game" role="img" aria-label="Broom Blasters playfield"></canvas>
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovLogo">
    <div class="panel">
      <h1 class="logo" id="ovLogo"></h1>
      <p class="credit">Hufflepuff Druski</p>
      <p class="sub" id="ovSub"></p>
      <div id="ovBody"></div>
      <button type="button" class="btn" id="ovBtn">Take flight</button>
    </div>
  </div>
</main>

<section id="deck" aria-label="Controls">
  <div id="left">
    <div id="pad" role="group" aria-label="Steering bar. Slide your thumb left and right.">
      <span class="cap">SLIDE TO FLY</span>
      <span class="track"></span>
      <span id="puck"></span>
    </div>
    <div id="mini">
      <button type="button" class="chip" id="btnPause">Pause</button>
      <button type="button" class="chip" id="btnSound" aria-pressed="true">Sound on</button>
    </div>
  </div>
  <button type="button" id="fire" aria-label="Cast spell">Cast</button>
</section>

<script>
(function(){
'use strict';

/* ---------- setup ---------- */
const W=360, H=560;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const ov=document.getElementById('overlay');
const ovLogo=document.getElementById('ovLogo');
const ovSub=document.getElementById('ovSub');
const ovBody=document.getElementById('ovBody');
const ovBtn=document.getElementById('ovBtn');
const pad=document.getElementById('pad');
const puck=document.getElementById('puck');
const fireBtn=document.getElementById('fire');
const btnPause=document.getElementById('btnPause');
const btnSound=document.getElementById('btnSound');

const css=getComputedStyle(document.documentElement);
const tok=k=>css.getPropertyValue(k).trim();
const COL={bg:tok('--bg'),bg2:tok('--bg-2'),ink:tok('--ink'),dim:tok('--ink-dim'),gold:tok('--gold'),amber:tok('--amber'),spell:tok('--spell'),ember:tok('--ember'),violet:tok('--violet'),line:tok('--line')};
const FD='"Uncial Antiqua", "Palatino Linotype", Georgia, serif';
const FU='Silkscreen, "Courier New", monospace';
const RM=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

try{ if(document.fonts){ document.fonts.load('12px Silkscreen'); document.fonts.load('20px "Uncial Antiqua"'); } }catch(e){}

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k*k*(3-2*k);
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}
function bez(p0,p1,p2,p3,t){const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;return{x:a*p0.x+b*p1.x+c*p2.x+d*p3.x,y:a*p0.y+b*p1.y+c*p2.y+d*p3.y};}

let dpr=1, scale=1;
function resize(){
  const r=stage.getBoundingClientRect();
  scale=Math.max(0.3,Math.min((r.width-4)/W,(r.height-4)/H));
  dpr=Math.min(window.devicePixelRatio||1,3);
  cv.style.width=(W*scale)+'px';
  cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr);
  cv.height=Math.round(H*scale*dpr);
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
window.addEventListener('resize',resize);

/* ---------- pixel sprites (all original designs) ---------- */
const PX=3;
function mk(rows,pal){
  const w=rows[0].length,h=rows.length;
  const c=document.createElement('canvas');
  c.width=w*PX;c.height=h*PX;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){const ch=rows[y][x];if(ch!=='.'&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*PX,y*PX,PX,PX);}}}
  return c;
}
const palBat={a:COL.violet,e:COL.ember};
const palWraith={a:'#c9d6ff',k:COL.bg,e:COL.ember};
const palImp={a:COL.ember,g:COL.gold,k:COL.bg};
const palArmor={a:'#b8c3d9',k:COL.bg,e:COL.spell,p:COL.gold};
const palArmorHurt={a:'#7d889c',k:COL.bg,e:COL.ember,p:COL.gold};
const palArmorFlash={a:COL.ink,k:COL.ink,e:COL.ink,p:COL.ink};
const palWiz={k:'#3b2f7a',g:COL.gold,s:'#f4cfa6',x:'#1b1510',y:COL.gold,b:'#c08a4a',t:COL.amber};

const ARMOR_BODY=['...aaaaaaa...','..aaaaaaaaa..','..akkkkkkka..','..akekkkeka..','..akkkkkkka..','..aaaaaaaaa..','...aa...aa...'];
const armorRows=function(top){return top.concat(ARMOR_BODY);};
const ARMOR_A=armorRows(['.....ppp.....','....ppppp....']);
const ARMOR_B=armorRows(['....ppp......','...ppppp.....']);

const SPR={
  bat:[mk(['aa..a.a..aa','aaa.aaa.aaa','aaaaaaaaaaa','.aaeaaaeaa.','..aaaaaaa..','...a.a.a...'],palBat),
       mk(['....a.a....','...aaaaa...','.aaaaaaaaa.','aaaeaaaeaaa','aa.aaaaa.aa','a...a.a...a'],palBat)],
  wraith:[mk(['...aaaaa...','..aaaaaaa..','.aakkkkkaa.','.aakekekaa.','.aakkkkkaa.','.aaaaaaaaa.','aaaaaaaaaaa','a.aa.a.aa.a'],palWraith),
          mk(['...aaaaa...','..aaaaaaa..','.aakkkkkaa.','.aakekekaa.','.aakkkkkaa.','.aaaaaaaaa.','aaaaaaaaaaa','.aa.aaa.aa.'],palWraith)],
  imp:[mk(['.g.......g.','.aa.....aa.','..aaaaaaa..','.aaaaaaaaa.','aaakaaakaaa','aaaaaaaaaaa','.a.aaaaa.a.','.a..a.a..a.'],palImp),
       mk(['.g.......g.','.aa.....aa.','..aaaaaaa..','.aaaaaaaaa.','aaakaaakaaa','aaaaaaaaaaa','..aaaaaaa..','.a.a...a.a.'],palImp)],
  armor:[mk(ARMOR_A,palArmor),mk(ARMOR_B,palArmor)],
  armorHurt:[mk(ARMOR_A,palArmorHurt),mk(ARMOR_B,palArmorHurt)],
  armorFlash:[mk(ARMOR_A,palArmorFlash),mk(ARMOR_B,palArmorFlash)],
  player:[mk(['......k......','.....kkk.....','....kgggk....','..kkkkkkkkk..','....sssss....','....sxsxs....','...yyyyyyy...','.yyyxyyyxyyy.','bbbbbbbbbbbbb','.....ttt.....'],palWiz),
          mk(['......k......','.....kkk.....','....kgggk....','..kkkkkkkkk..','....sssss....','....sxsxs....','...yyyyyyy...','.yyyxyyyxyyy.','bbbbbbbbbbbbb','....ttttt....'],palWiz)]
};
const TYPES={
  bat:{spr:SPR.bat,w:30,h:18,hp:1,pts:50,dive:100,boom:[COL.violet,COL.ink]},
  wraith:{spr:SPR.wraith,w:30,h:22,hp:1,pts:80,dive:160,boom:[COL.spell,COL.ink,COL.violet]},
  imp:{spr:SPR.imp,w:30,h:22,hp:1,pts:100,dive:200,boom:[COL.ember,COL.gold]},
  armor:{spr:SPR.armor,hurt:SPR.armorHurt,flash:SPR.armorFlash,w:36,h:26,hp:2,pts:150,dive:400,boom:[COL.spell,COL.gold,COL.ink]}
};
function drawSpr(c,x,y){ctx.drawImage(c,Math.round(x-c.width/2),Math.round(y-c.height/2));}

/* ---------- lessons ---------- */
const EP_BG=[['#0d1230','#1d2a5c'],['#0a1a2a','#124a5a'],['#1a0f2e','#3d2466'],['#101c18','#1d4a3a'],['#1f1408','#4a3010'],['#1a0c1a','#4a1f4a'],['#0b1626','#233f6b'],['#150f20','#43285f']];
const EP_INFO=[
  ['FIRST FLIGHT','Hold on tight.'],
  ['POTIONS CLASS','Do not drink the green one.'],
  ['MIDNIGHT LIBRARY','Whisper your spells.'],
  ['STORM OVER THE LAKE','Lightning is not a hall pass.'],
  ['THE TWISTING STAIRS','Mind the gap.'],
  ['HAUNTED HALLWAY','Every portrait has opinions.'],
  ['THE LONG WINTER','Mind the icicles.'],
  ['FINAL EXAM','No notes allowed.']
];
const QUIPS=['WELL CAST!','TOP MARKS!','SPELLBOUND','BRILLIANT','ENCHANTING','TEN POINTS!','SHARP WAND','NICE FLYING'];
const BOSS_QUIPS=['BANISHED!','ARMOR DOWN!','CLASS DISMISSED','HAUNT OVER'];

/* ---------- audio ---------- */
let ac=null, muted=false;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
  return ac;
}
function tone(freq,dur,type,vol,slide,delay){
  if(muted||!ac)return;
  const t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t0+dur);
  g.gain.setValueAtTime(vol||0.05,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(ac.destination);
  o.start(t0);o.stop(t0+dur+0.03);
}
function noise(dur,vol){
  if(muted||!ac)return;
  const n=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,n,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource();s.buffer=buf;
  const g=ac.createGain();g.gain.value=vol;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;
  s.connect(f);f.connect(g);g.connect(ac.destination);
  s.start();
}
const sfxShoot=()=>{tone(1100,.09,'triangle',.04,-600);tone(1650,.06,'sine',.02,-400,.01);};
const sfxHit=()=>tone(260,.12,'sawtooth',.05,-120);
const sfxBoom=()=>{noise(.28,.09);tone(140,.22,'triangle',.07,-90);};
const sfxPlayerBoom=()=>{noise(.7,.16);tone(180,.6,'sawtooth',.07,-140);};
const sfxEnemyShot=()=>tone(300,.09,'square',.025,-140);
const sfxPick=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.09,'triangle',.06,0,i*.06));
const sfxJingle=()=>[392,523,659,784].forEach((f,i)=>tone(f,.14,'triangle',.06,0,i*.09));
const sfxLife=()=>[659,784,988,1319].forEach((f,i)=>tone(f,.1,'triangle',.07,0,i*.07));
const sfxWrap=()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.11,'triangle',.06,0,i*.08));
const sfxOver=()=>[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.07,0,i*.2));

/* ---------- state ---------- */
function loadHi(){try{return parseInt(localStorage.getItem('broom-blasters-hi')||'0',10)||0;}catch(e){return 0;}}
function saveHi(v){try{localStorage.setItem('broom-blasters-hi',String(v));}catch(e){}}

const P={x:W/2,y:H-52,w:24,h:22,alive:true,inv:0,dual:0,cool:0,deadT:0};
const input={left:false,right:false,fire:false,pad:null};
let enemies=[],pb=[],eb=[],parts=[],pops=[],picks=[];
let time=0,last=0;
const st={state:'title',prev:'play',score:0,hi:loadHi(),newHi:false,lives:3,ep:1,introT:0,clearT:0,
  diveT:3,shootT:3,streak:0,comboT:0,mult:1,shots:0,hits:0,acc:0,bonus:0,nextLife:10000,shake:0};

const stars=[];
for(let i=0;i<70;i++)stars.push({x:rand(0,W),y:rand(0,H),z:1+Math.floor(Math.random()*3),tw:rand(0,6)});
const TOWERS=[[10,40,70],[64,30,104],[116,44,62],[176,34,124],[236,40,84],[292,38,100],[340,30,64]];

function resetGame(){
  st.score=0;st.lives=3;st.ep=1;st.nextLife=10000;st.streak=0;st.comboT=0;st.mult=1;st.newHi=false;st.shake=0;
  P.x=W/2;P.alive=true;P.inv=1.5;P.dual=0;P.cool=0;P.deadT=0;
  enemies=[];pb=[];eb=[];parts=[];pops=[];picks=[];
}

function startEpisode(){
  enemies=[];eb=[];picks=[];
  st.introT=2.4;st.shots=0;st.hits=0;st.diveT=2.5;st.shootT=3;
  const d=st.ep-1;
  const groups=[
    {row:3,type:'bat',cols:[0,1,2,3,4,5,6,7],side:-1,delay:1.2},
    {row:2,type:'wraith',cols:[0,1,2,3,4,5,6,7],side:1,delay:2.9},
    {row:1,type:'imp',cols:[1,2,3,4,5,6],side:-1,delay:4.6},
    {row:0,type:'armor',cols:[2,3,4,5],side:1,delay:6.1}
  ];
  groups.forEach(g=>g.cols.forEach((c,i)=>{
    const t=TYPES[g.type];
    enemies.push({type:g.type,t:t,col:c,row:g.row,hp:t.hp,x:-60,y:-60,state:'wait',delay:g.delay+i*0.13,
      tt:0,dur:Math.max(1.8,2.5-d*0.06),side:g.side,p0:null,p1:null,p2:null,shotsLeft:0,shootK:0,flash:0});
  }));
}

function startGame(){
  audio();
  resetGame();
  startEpisode();
  st.state='play';
  hideOverlay();
  sfxJingle();
}

function slot(e){
  const sp=38+Math.sin(time*0.8)*2.5;
  const sway=Math.sin(time*0.7)*14;
  return{x:W/2+(e.col-3.5)*sp+sway,y:84+e.row*32};
}

/* ---------- helpers ---------- */
function popup(x,y,text,color,size){
  if(pops.length>22)pops.shift();
  pops.push({x:clamp(x,40,W-40),y:y,text:text,color:color,size:size||11,t:0,life:0.9});
}
function boom(x,y,cols,n,spd){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2),v=rand(30,spd);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rand(.35,.7),c:pick(cols),s:rand(2,4)});
  }
}
function addScore(n){
  st.score+=n;
  while(st.score>=st.nextLife){
    st.lives=Math.min(6,st.lives+1);
    st.nextLife+=30000;
    popup(W/2,H-90,'EXTRA LIFE!',COL.gold,14);
    sfxLife();
  }
}

/* ---------- player actions ---------- */
function tryShoot(){
  if(!P.alive||st.state!=='play'||P.cool>0)return;
  const lim=P.dual>0?6:3;
  if(pb.length>=lim)return;
  if(P.dual>0){pb.push({x:P.x-9,y:P.y-14},{x:P.x+9,y:P.y-14});st.shots+=2;}
  else{pb.push({x:P.x,y:P.y-16});st.shots+=1;}
  P.cool=0.14;
  sfxShoot();
}
function killPlayer(){
  if(!P.alive)return;
  P.alive=false;P.deadT=1.5;P.dual=0;
  st.lives=Math.max(0,st.lives-1);
  st.streak=0;st.comboT=0;st.mult=1;
  st.shake=0.35;
  boom(P.x,P.y,[COL.gold,COL.ink,COL.amber,COL.spell],30,190);
  sfxPlayerBoom();
}
function killEnemy(e){
  const diving=e.state==='dive'||e.state==='return';
  st.streak=st.comboT>0?st.streak+1:1;
  st.comboT=1.5;
  const m=st.streak>=8?4:st.streak>=5?3:st.streak>=3?2:1;
  if(m>st.mult)popup(P.x,P.y-44,'x'+m+' STREAK',COL.gold,14);
  st.mult=m;
  const pts=(diving?e.t.dive:e.t.pts)*m;
  addScore(pts);
  popup(e.x,e.y-6,'+'+pts,COL.ink,10);
  boom(e.x,e.y,e.t.boom,14,150);
  if(e.type==='armor'){
    popup(e.x,e.y-22,pick(BOSS_QUIPS),COL.spell,12);
    if(Math.random()<0.5)picks.push({x:e.x,y:e.y});
  }else if(Math.random()<0.1){
    popup(e.x,e.y-22,pick(QUIPS),COL.spell,11);
  }
  const i=enemies.indexOf(e);
  if(i>=0)enemies.splice(i,1);
  sfxBoom();
}

/* ---------- enemy behavior ---------- */
function setupEntry(e){
  const L=e.side<0;
  e.p0={x:L?50:W-50,y:-30};
  e.p1={x:L?W+40:-40,y:170};
  e.p2={x:L?10:W-10,y:400};
}
function startDive(e){
  e.state='dive';e.tt=0;
  e.dur=Math.max(1.5,2.7-(st.ep-1)*0.12)*(e.type==='armor'?1.15:1);
  const dir=e.x<W/2?1:-1;
  e.p0={x:e.x,y:e.y};
  e.p1={x:e.x-dir*110,y:e.y+70};
  e.p2={x:P.x+rand(-70,70),y:370};
  e.p3={x:rand(30,W-30),y:H+50};
  e.shotsLeft=st.ep>2?2:1;
  e.shootK=0.3;
}
function enemyShoot(e){
  const sp=130+Math.min(120,(st.ep-1)*10);
  let a=Math.atan2(P.y-e.y,P.x-e.x)+(Math.random()-0.5)*0.3;
  a=clamp(a,0.35,Math.PI-0.35);
  eb.push({x:e.x,y:e.y+8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp});
  sfxEnemyShot();
}
function updateEnemies(dt){
  for(const e of enemies){
    if(e.flash>0)e.flash-=dt;
    if(e.state==='wait'){
      e.delay-=dt;
      if(e.delay<=0){e.state='enter';e.tt=0;setupEntry(e);}
    }else if(e.state==='enter'){
      e.tt+=dt/e.dur;
      const k=Math.min(1,e.tt);
      const p=bez(e.p0,e.p1,e.p2,slot(e),ease(k));
      e.x=p.x;e.y=p.y;
      if(k>=1)e.state='form';
    }else if(e.state==='form'){
      const s=slot(e);e.x=s.x;e.y=s.y;
    }else if(e.state==='dive'){
      e.tt+=dt/e.dur;
      const k=Math.min(1,e.tt);
      const p=bez(e.p0,e.p1,e.p2,e.p3,k);
      e.x=p.x;e.y=p.y;
      if(e.shotsLeft>0&&k>e.shootK&&P.alive){enemyShoot(e);e.shotsLeft--;e.shootK+=0.18;}
      if(k>=1){e.state='return';e.tt=0;}
    }else if(e.state==='return'){
      e.tt+=dt/0.9;
      const s=slot(e),k=Math.min(1,e.tt);
      e.x=s.x;e.y=-30+(s.y+30)*ease(k);
      if(k>=1)e.state='form';
    }
  }
  const arrived=!enemies.some(e=>e.state==='wait'||e.state==='enter');
  if(arrived&&P.alive&&st.state==='play'){
    st.diveT-=dt;
    if(st.diveT<=0){
      const diving=enemies.filter(e=>e.state==='dive'||e.state==='return').length;
      const maxD=Math.min(6,2+Math.floor((st.ep-1)/2));
      const pool=enemies.filter(e=>e.state==='form');
      if(diving<maxD&&pool.length)startDive(pick(pool));
      st.diveT=rand(0.7,1.5)*Math.max(0.5,1-(st.ep-1)*0.06);
    }
    st.shootT-=dt;
    if(st.shootT<=0){
      const pool=enemies.filter(e=>e.state==='form');
      if(pool.length)enemyShoot(pick(pool));
      st.shootT=rand(1.2,2.4)*Math.max(0.45,1-(st.ep-1)*0.05);
    }
  }
}

/* ---------- main update ---------- */
function updateStars(dt){
  const sp=[0,22,48,90];
  for(const s of stars){
    s.y+=sp[s.z]*dt*(RM?0.2:1);
    if(s.y>H){s.y=-2;s.x=rand(0,W);}
  }
}
function updateFx(dt){
  if(st.shake>0)st.shake-=dt;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;
    if(p.t>p.life)parts.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i];
    p.t+=dt;p.y-=26*dt;
    if(p.t>p.life)pops.splice(i,1);
  }
}
function beginClear(){
  st.state='clear';st.clearT=3;eb=[];
  st.acc=st.shots?Math.round(st.hits/st.shots*100):0;
  st.bonus=st.acc>=80?3000:st.acc>=60?1000:0;
  if(st.bonus)addScore(st.bonus);
  sfxWrap();
}
function gameOver(){
  st.state='over';
  enemies=[];eb=[];pb=[];picks=[];
  if(st.score>st.hi){st.hi=st.score;saveHi(st.hi);st.newHi=true;}
  sfxOver();
  setTimeout(function(){if(st.state==='over')showOverlay('over');},800);
}

function update(dt){
  if(st.state==='paused')return;
  time+=dt;
  updateStars(dt);
  updateFx(dt);
  if(st.state!=='play'&&st.state!=='clear')return;

  if(st.introT>0)st.introT-=dt;

  /* player */
  if(P.alive){
    if(input.pad!==null){
      const d=input.pad-P.x,m=900*dt;
      P.x+=clamp(d,-m,m);
    }else{
      const dir=(input.right?1:0)-(input.left?1:0);
      P.x+=dir*300*dt;
    }
    P.x=clamp(P.x,18,W-18);
    if(P.cool>0)P.cool-=dt;
    if(P.inv>0)P.inv-=dt;
    if(P.dual>0)P.dual-=dt;
    if(input.fire)tryShoot();
  }else{
    P.deadT-=dt;
    if(P.deadT<=0){
      if(st.lives>0){P.alive=true;P.x=W/2;P.inv=2.2;eb=[];st.diveT=Math.max(st.diveT,1);}
      else{gameOver();return;}
    }
  }

  if(st.comboT>0){st.comboT-=dt;if(st.comboT<=0){st.streak=0;st.mult=1;}}

  if(st.state==='clear'){
    st.clearT-=dt;
    if(st.clearT<=0){st.ep++;startEpisode();st.state='play';sfxJingle();}
  }

  updateEnemies(dt);

  /* player spells */
  for(let i=pb.length-1;i>=0;i--){
    const b=pb[i];
    b.y-=540*dt;
    if(b.y<-12){pb.splice(i,1);continue;}
    const e=enemies.find(en=>en.state!=='wait'&&Math.abs(b.x-en.x)<en.t.w/2+2&&Math.abs(b.y-en.y)<en.t.h/2+5);
    if(e){
      pb.splice(i,1);st.hits++;e.hp--;
      if(e.hp<=0)killEnemy(e);else{e.flash=0.12;sfxHit();}
    }
  }
  /* enemy bolts */
  for(let i=eb.length-1;i>=0;i--){
    const b=eb[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>H+10||b.x<-10||b.x>W+10){eb.splice(i,1);continue;}
    if(P.alive&&P.inv<=0&&Math.abs(b.x-P.x)<P.w/2-2&&Math.abs(b.y-P.y)<P.h/2){
      eb.splice(i,1);killPlayer();
    }
  }
  /* ramming */
  if(P.alive&&P.inv<=0){
    for(const e of enemies.slice()){
      if(e.state==='wait')continue;
      if(Math.abs(e.x-P.x)<e.t.w/2+P.w/2-5&&Math.abs(e.y-P.y)<e.t.h/2+P.h/2-5){
        killPlayer();killEnemy(e);break;
      }
    }
  }
  /* pickups */
  for(let i=picks.length-1;i>=0;i--){
    const k=picks[i];
    k.y+=80*dt;
    if(k.y>H+20){picks.splice(i,1);continue;}
    if(P.alive&&Math.abs(k.x-P.x)<20&&Math.abs(k.y-P.y)<20){
      picks.splice(i,1);P.dual=12;
      popup(P.x,P.y-40,'DOUBLE CAST!',COL.gold,14);
      sfxPick();
    }
  }
  /* lesson cleared */
  if(st.state==='play'&&enemies.length===0&&st.introT<=0)beginClear();
}

/* ---------- drawing ---------- */
function text(s,x,y,size,color,align,font){
  ctx.font=size+'px '+(font||FU);
  ctx.fillStyle=color;
  ctx.textAlign=align||'left';
  ctx.textBaseline='middle';
  ctx.fillText(s,x,y);
}
function drawMoon(){
  ctx.fillStyle=rgba(COL.gold,.08);
  ctx.beginPath();ctx.arc(292,104,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgba(COL.ink,.22);
  ctx.beginPath();ctx.arc(292,104,21,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgba(COL.bg,.35);
  ctx.beginPath();ctx.arc(299,100,17,0,Math.PI*2);ctx.fill();
}
function drawCastle(){
  const base=H;
  ctx.fillStyle=rgba(COL.bg,.72);
  TOWERS.forEach(function(t){
    const x=t[0],w=t[1],h=t[2];
    ctx.fillRect(x,base-h,w,h);
    ctx.beginPath();
    ctx.moveTo(x-3,base-h);
    ctx.lineTo(x+w/2,base-h-w*0.95);
    ctx.lineTo(x+w+3,base-h);
    ctx.closePath();ctx.fill();
  });
  ctx.fillRect(0,base-34,W,34);
  TOWERS.forEach(function(t,i){
    const a=0.3+0.25*Math.sin(time*1.7+i*2.1);
    ctx.fillStyle=rgba(COL.gold,a);
    ctx.fillRect(Math.round(t[0]+t[1]*0.3),base-t[2]+14,3,5);
    ctx.fillRect(Math.round(t[0]+t[1]*0.62),base-t[2]+36,3,5);
  });
}
function drawStars(){
  for(const s of stars){
    const a=s.z===3?0.55+0.45*Math.sin(time*2.2+s.tw):s.z===2?0.6:0.35;
    ctx.fillStyle=rgba(s.z===3?COL.gold:COL.ink,a);
    const sz=s.z===3?2:1;
    ctx.fillRect(Math.round(s.x),Math.round(s.y),sz,sz);
  }
}
function banner(l1,l2,l3,alpha){
  ctx.save();
  ctx.globalAlpha=clamp(alpha,0,1);
  const y=H*0.38;
  ctx.fillStyle=rgba(COL.bg,.86);
  ctx.fillRect(0,y-52,W,116);
  ctx.fillStyle=COL.gold;ctx.fillRect(0,y-52,W,2);
  ctx.fillStyle=COL.gold;ctx.fillRect(0,y+62,W,2);
  text(l1,W/2,y-30,11,COL.spell,'center',FU);
  let size=28;
  ctx.font=size+'px '+FD;
  while(size>14&&ctx.measureText(l2).width>W-36){size--;ctx.font=size+'px '+FD;}
  text(l2,W/2,y+3,size,tok('--gold-deep'),'center',FD);
  text(l2,W/2,y,size,COL.gold,'center',FD);
  if(l3)text(l3,W/2,y+38,11,COL.dim,'center',FU);
  ctx.restore();
}
function lessonLabel(){return 'YEAR '+(Math.floor((st.ep-1)/8)+1)+' - LESSON '+(((st.ep-1)%8)+1);}

function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(st.shake>0&&!RM)ctx.translate(rand(-3,3),rand(-3,3));
  ctx.imageSmoothingEnabled=false;
  const bgc=EP_BG[(st.ep-1)%EP_BG.length];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,bgc[0]);g.addColorStop(1,bgc[1]);
  ctx.fillStyle=g;ctx.fillRect(-6,-6,W+12,H+12);
  drawMoon();drawStars();drawCastle();
  if(st.state==='title')return;

  /* enemies */
  for(const e of enemies){
    if(e.state==='wait')continue;
    const f=Math.floor(time*3+e.col)%2;
    let set=e.t.spr;
    if(e.type==='armor'){
      if(e.flash>0)set=e.t.flash;
      else if(e.hp<e.t.hp)set=e.t.hurt;
    }
    drawSpr(set[f],e.x,e.y);
  }
  /* pickups */
  for(const k of picks){
    ctx.fillStyle=rgba(COL.gold,.25);
    ctx.beginPath();ctx.arc(k.x,k.y,16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COL.gold;
    ctx.beginPath();ctx.arc(k.x,k.y,11,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=COL.ink;ctx.lineWidth=2;ctx.stroke();
    text('x2',k.x,k.y+1,10,COL.bg,'center',FU);
  }
  /* spells */
  for(const b of pb){
    ctx.fillStyle=rgba(COL.spell,.35);ctx.fillRect(b.x-2.5,b.y-3,5,16);
    ctx.fillStyle=COL.spell;ctx.fillRect(b.x-1.5,b.y-7,3,10);
    ctx.fillStyle=COL.ink;ctx.fillRect(b.x-0.75,b.y-9,1.5,11);ctx.fillRect(b.x-4,b.y-4,8,1.5);
  }
  for(const b of eb){
    ctx.fillStyle=rgba(COL.ember,.3);
    ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COL.ember;
    ctx.beginPath();ctx.arc(b.x,b.y,3.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COL.gold;
    ctx.beginPath();ctx.arc(b.x,b.y,1.5,0,Math.PI*2);ctx.fill();
  }
  /* player */
  if(P.alive&&!(P.inv>0&&Math.floor(time*12)%2===0)){
    drawSpr(SPR.player[Math.floor(time*14)%2],P.x,P.y);
    if(P.dual>0){ctx.fillStyle=COL.spell;ctx.fillRect(Math.round(P.x-22),Math.round(P.y-4),3,8);ctx.fillRect(Math.round(P.x+19),Math.round(P.y-4),3,8);}
  }
  /* particles */
  for(const p of parts){
    ctx.fillStyle=rgba(p.c,clamp(1-p.t/p.life,0,1));
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
  }
  /* popups */
  for(const p of pops){
    ctx.save();
    ctx.globalAlpha=clamp(1-(p.t/p.life)*(p.t/p.life),0,1);
    text(p.text,p.x+1,p.y+1,p.size,COL.bg,'center',FU);
    text(p.text,p.x,p.y,p.size,p.color,'center',FU);
    ctx.restore();
  }

  /* HUD */
  text('POINTS',12,16,10,COL.spell,'left',FU);
  text(String(st.score).padStart(6,'0'),12,33,16,COL.ink,'left',FU);
  text('BEST',W/2,16,10,COL.spell,'center',FU);
  text(String(Math.max(st.hi,st.score)).padStart(6,'0'),W/2,33,16,COL.ink,'center',FU);
  text('LESSON',W-12,16,10,COL.spell,'right',FU);
  text((Math.floor((st.ep-1)/8)+1)+'-'+(((st.ep-1)%8)+1),W-12,33,16,COL.ink,'right',FU);
  if(st.mult>1){
    text('x'+st.mult+' STREAK',12,54,11,COL.gold,'left',FU);
    ctx.fillStyle=COL.gold;
    ctx.fillRect(12,63,Math.round(60*clamp(st.comboT/1.5,0,1)),3);
  }
  for(let i=0;i<st.lives;i++){
    ctx.drawImage(SPR.player[0],12+i*20,H-24,16,14);
  }
  text('HUFFLEPUFF DRUSKI',W/2,H-6,8,rgba(COL.ink,0.5),'center',FU);
  if(P.dual>0){
    text('DOUBLE CAST',W-12,H-24,9,COL.gold,'right',FU);
    ctx.fillStyle=COL.gold;
    const bw=Math.round(70*clamp(P.dual/12,0,1));
    ctx.fillRect(W-12-bw,H-14,bw,4);
  }

  /* cards */
  if((st.state==='play'||st.state==='paused')&&st.introT>0){
    const info=EP_INFO[(st.ep-1)%EP_INFO.length];
    banner(lessonLabel(),info[0],info[1],Math.min((2.4-st.introT)/0.25,st.introT/0.35,1));
  }
  if(st.state==='clear'){
    const l3=st.bonus?('HOUSE POINTS  +'+st.bonus):'SEE ME AFTER CLASS';
    banner('ACCURACY '+st.acc+'%','TOP OF THE CLASS',l3,Math.min((3-st.clearT)/0.25,st.clearT/0.35,1));
  }
}

/* ---------- overlay screens ---------- */
let ovMode='title';
const DEX=[
  ['bat','BAT','Swoops in tight packs. Hates daylight.'],
  ['wraith','GLOOM WRAITH','Drifts down the corridors, then dives.'],
  ['imp','IMP','Throws sparks. Giggles about it.'],
  ['armor','HAUNTED ARMOR','Takes two hits to dispel. Drops a DOUBLE CAST.']
];
function buildDex(){
  const ul=document.createElement('ul');ul.className='dex';
  DEX.forEach(function(row){
    const li=document.createElement('li');
    const spr=TYPES[row[0]].spr[0];
    const c=document.createElement('canvas');
    c.width=spr.width;c.height=spr.height;
    c.getContext('2d').drawImage(spr,0,0);
    c.setAttribute('aria-hidden','true');
    const box=document.createElement('div');
    const b=document.createElement('b');b.textContent=row[1];
    const s=document.createElement('span');s.textContent=row[2];
    box.append(b,s);li.append(c,box);ul.append(li);
  });
  return ul;
}
function para(cls,txt){const p=document.createElement('p');p.className=cls;p.textContent=txt;return p;}
function setLogo(a,b){
  ovLogo.replaceChildren();
  const s1=document.createElement('span');s1.className='a';s1.textContent=a;
  const s2=document.createElement('span');s2.className='b';s2.textContent=b;

}
function statBox(label,value,hot){
  const d=document.createElement('div');if(hot)d.className='hot';
  const s=document.createElement('small');s.textContent=label;
  const v=document.createElement('strong');v.textContent=value;
  d.append(s,v);return d;
}
function showOverlay(mode){
  ovMode=mode;
  ov.hidden=false;
  ovBody.replaceChildren();
  if(mode==='title'){
    setLogo('BROOM','BLASTERS');
    ovSub.textContent='A midnight shoot-’em-up for young wizards.';
    ovBody.append(buildDex());
    ovBody.append(para('hint','Slide the bar with your left thumb to fly. Hold CAST with your right to fire spells. Chain hits for a streak. On a keyboard: arrow keys and space.'));
    ovBody.append(para('best','BEST RUN '+String(st.hi).padStart(6,'0')));
    ovBtn.textContent='Take flight';
  }else if(mode==='over'){
    setLogo('CLASS','DISMISSED');
    ovSub.textContent=st.newHi?'A new best. Ten points to your house.':'Detention awaits. Care to try again?';
    const wrap=document.createElement('div');wrap.className='stats';
    wrap.append(statBox('POINTS',String(st.score).padStart(6,'0'),st.newHi),statBox('BEST',String(st.hi).padStart(6,'0'),false),statBox('LESSON',(Math.floor((st.ep-1)/8)+1)+'-'+(((st.ep-1)%8)+1),false));
    ovBody.append(wrap);

  }else{
    setLogo('TAKING','A BREAK');

}
function hideOverlay(){ov.hidden=true;}

function pause(){

}
function resume(){
  if(st.state==='paused'){st.state=st.prev;hideOverlay();}
}

/* ---------- input ---------- */
let padPtr=null,firePtr=null;
function padSet(clientX){
  const r=pad.getBoundingClientRect();
  const f=clamp((clientX-r.left-25)/Math.max(1,r.width-50),0,1);
  input.pad=18+f*(W-36);
  pad.classList.add('used');
}
pad.addEventListener('pointerdown',function(e){
  audio();
  try{pad.setPointerCapture(e.pointerId);}catch(err){}
  padPtr=e.pointerId;padSet(e.clientX);e.preventDefault();
});
pad.addEventListener('pointermove',function(e){if(e.pointerId===padPtr)padSet(e.clientX);});
['pointerup','pointercancel','lostpointercapture'].forEach(function(t){
  pad.addEventListener(t,function(e){if(e.pointerId===padPtr){padPtr=null;input.pad=null;}});
});
fireBtn.addEventListener('pointerdown',function(e){
  audio();
  try{fireBtn.setPointerCapture(e.pointerId);}catch(err){}
  firePtr=e.pointerId;input.fire=true;fireBtn.classList.add('down');e.preventDefault();
});
['pointerup','pointercancel','lostpointercapture'].forEach(function(t){
  fireBtn.addEventListener(t,function(e){if(e.pointerId===firePtr){firePtr=null;input.fire=false;fireBtn.classList.remove('down');}});
});
cv.addEventListener('pointerdown',function(e){audio();tryShoot();e.preventDefault();});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.getElementById('deck').addEventListener('contextmenu',function(e){e.preventDefault();});

function key(e,down){
  const k=e.code;
  if(k==='ArrowLeft'||k==='KeyA'){input.left=down;e.preventDefault();}
  else if(k==='ArrowRight'||k==='KeyD'){input.right=down;e.preventDefault();}
  else if(k==='Space'||k==='KeyZ'||k==='ArrowUp'){
    if(st.state==='play'||st.state==='clear'){input.fire=down;e.preventDefault();}
  }else if(down&&k==='KeyP'){if(st.state==='paused')resume();else pause();}
  else if(down&&k==='KeyM'){btnSound.click();}
}
document.addEventListener('keydown',function(e){if(!e.repeat)key(e,true);});
document.addEventListener('keyup',function(e){key(e,false);});

/* ---------- loop ---------- */
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000||0);
  last=now;
  update(dt);
  draw();
  const f=(P.x-18)/(W-36);
  puck.style.left='calc(23px + '+f.toFixed(4)+' * (100% - 46px))';
  requestAnimationFrame(frame);
}
resize();
showOverlay('title');
last=performance.now();
requestAnimationFrame(frame);
})();
</script>
</html>
